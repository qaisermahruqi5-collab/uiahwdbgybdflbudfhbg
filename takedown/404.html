<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>404 Not Found</title>
<style>
  html { background: #fff; color: #111; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    text-align: center;
    padding: 24px;
  }
  h1 { font-size: 64px; font-weight: 600; margin: 0 0 8px; letter-spacing: -1px; }
  p  { font-size: 16px; margin: 0; color: #555; }
  hr { width: 120px; border: 0; border-top: 1px solid #ddd; margin: 24px 0; }
  small { color: #999; font-size: 13px; }
</style>
</head>
<body>
  <h1>404</h1>
  <p>Not Found</p>
  <hr>
  <small>The requested URL was not found on this server.</small>
</body>
</html>
