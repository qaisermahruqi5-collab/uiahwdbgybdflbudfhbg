<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Genoa Academy Oman</title>
    <meta name="description" content="Official Genoa CFC Academy in Muscat, Oman. Elite youth football training for boys and girls aged 5 to 16, U6 to U16." />
    <meta name="theme-color" content="#060F25" />

    <!-- Favicons & app icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Genoa Academy Oman" />
    <meta property="og:description" content="Official Genoa CFC Academy in Muscat, Oman. Elite youth football training for boys and girls aged 5 to 16, U6 to U16." />
    <meta property="og:image" content="https://www.genoaacademyom.com/og-image.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Genoa Academy Oman" />
    <meta name="twitter:description" content="Official Genoa CFC Academy in Muscat, Oman. Elite youth football training for boys and girls aged 5 to 16, U6 to U16." />
    <meta name="twitter:image" content="https://www.genoaacademyom.com/og-image.jpg" />

    <!-- ANALYTICS (optional): disabled by default. To enable, replace your-domain.com
         with your real domain and delete the comment markers around the script tag.
    <script defer data-domain="your-domain.com" src="https://plausible.io/js/script.js"></script>
    -->

    <!-- Structured data
         EDITING THIS BLOCK CHANGES ITS CSP HASH. Run `npm run csp-hash` and
         paste the printed value into script-src in netlify.toml, or search
         engines stop reading it (the page itself keeps working).

         Address, geo and opening hours mirror src/data/content.ts LOCATION
         and content/schedule.json. If the venue or the training times change,
         update them here too — this is what Google shows in a map result. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SportsActivityLocation",
      "name": "Genoa Academy Oman",
      "description": "Official Genoa CFC Academy in Muscat, Oman. Elite youth football training for boys and girls aged 5 to 16, U6 to U16.",
      "sport": "Football",
      "address": {
        "@type": "PostalAddress",
        "name": "ABQ Azzan Bin Qais International School — MQ Campus",
        "streetAddress": "Madinat Sultan Qaboos",
        "addressLocality": "Muscat",
        "postalCode": "115",
        "addressCountry": "OM"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 23.5843,
        "longitude": 58.4469
      },
      "hasMap": "https://www.google.com/maps/search/?api=1&query=HCMW%2BQCM%20Muscat",
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Sunday", "Tuesday", "Wednesday"],
          "opens": "17:00",
          "closes": "21:00"
        }
      ],
      "telephone": "+968****1599",
      "sameAs": ["https://www.instagram.com/genoaacademyoman/"]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
